name: Alex Stewart
title: Developer Community Advocate
bio: |

Born in Sacramento, I spent a decade in NYC as a professional ballet dancer and stage actor, even performing on Broadway. As the demands of performing took a toll, a conversation with my friend Chloe (a Google Cloud Developer Advocate) sparked a career shift. I discovered Developer Advocacy and began my journey in software development, dragging my best friend, Sam LaRiviere, along with me (which has been the best part). After working at Codesmith as a Technical Content Creator and Engineering Fellow, blending creativity and tech, writing content, interviewing alumni, hosting talent shows, giving lectures, and shaping curriculum, I have moved into a Developer Community Advocate role. I love the balance of creative freedom and technical depth. Fun fact: I’ve never had a cavity!
